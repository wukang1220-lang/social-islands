<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img"><title>河流與冰河侵蝕形成不同谷形，冰河地形積水可成峽灣與冰蝕湖。</title><text x="180" y="21" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">冰河地形</text><line x1="180" y1="35" x2="180" y2="236" stroke="var(--fig-line)" stroke-width="1.5" /><line x1="12" y1="137" x2="348" y2="137" stroke="var(--fig-line)" stroke-width="1.5" /><text x="93" y="49" font-size="12" text-anchor="middle" fill="var(--fig-ink)">河流侵蝕：V 型谷</text><text x="267" y="49" font-size="12" text-anchor="middle" fill="var(--fig-ink)">冰河侵蝕：U 型谷</text><path d="M20 68L42 68L92 118L142 68H166V126H20Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M194 68H214C218 68 220 118 245 118H289C314 118 316 68 320 68H340V126H194Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="93" y="159" font-size="12" text-anchor="middle" fill="var(--fig-ink)">海水灌入 U 型谷：</text><text x="93" y="176" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">峽灣</text><text x="267" y="159" font-size="12" text-anchor="middle" fill="var(--fig-ink)">低窪處積水：</text><text x="267" y="176" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">冰蝕湖</text><path d="M20 190H40C44 190 46 233 69 233H117C140 233 142 190 146 190H166V239H20Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 213H138C134.4 224.6 128 233 117 233H69C58 233 51.6 224.6 48 213Z" fill="var(--fig-sea)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="48" y1="213" x2="138" y2="213" stroke="var(--fig-ink)" stroke-width="1.5" /><path d="M194 207L218 198Q224 231 251 231H290Q313 231 318 198L340 207V239H194Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-line