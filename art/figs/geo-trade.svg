<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 235" role="img"><title>臺灣進出口項目、原因與主要貿易夥伴。</title><defs><marker id="geo-trade-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="139" y="72" width="82" height="69" rx="6" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="180" y="113" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">臺灣</text><text x="68" y="31" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">進口</text><text x="292" y="31" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">出口</text><path d="M18 92L131 92" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-trade-arr)"/><path d="M229 92L342 92" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-trade-arr)"/><text x="69" y="56" font-size="11" text-anchor="middle" fill="var(--fig-ink)">原油、煤等能源</text><text x="69" y="73" font-size="11" text-anchor="middle" fill="var(--fig-ink)">零件、機械設備</text><text x="292" y="56" font-size="11" text-anchor="middle" fill="var(--fig-ink)">積體電路等</text><text x="292" y="73" font-size="11" text-anchor="middle" fill="var(--fig-ink)">高科技產品</text><text x="69" y="128" font-size="12" text-anchor="middle" fill="var(--fig-ink)">缺乏自然資源</text><text x="292" y="128" font-size="12" text-anchor="middle" fill="var(--fig-ink)">國內市場小</text><rect x="10" y="164" width="340" height="58" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="185" font-size="12" text-anchor="middle" fill="var(--fig-ink)">主要貿易夥伴：中國、美國、日本</text><text x="180" y="208" font-size="12" text-anchor="middle" fill="var(--fig-ink)">多為出超：出口值＞進口值</text></svg>
