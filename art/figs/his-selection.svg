<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 221" role="img"><title>中國選官方式由察舉經九品官人之法演變為科舉。</title><defs><marker id="his-selection-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="8" y="27" width="104" height="139" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="60" y="52" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">漢</text><text x="60" y="82" font-size="12" text-anchor="middle" fill="var(--fig-ink)">察舉・太學</text><path d="M18 95L102 95" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="121" font-size="11" text-anchor="middle" fill="var(--fig-ink)">推舉孝子廉吏</text><rect x="128" y="27" width="104" height="139" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="52" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">魏晉南北朝</text><text x="180" y="82" font-size="12" text-anchor="middle" fill="var(--fig-ink)">九品官人之法</text><path d="M138 95L222 95" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="121" font-size="11" text-anchor="middle" fill="var(--fig-ink)">上品無寒門，</text><text x="180" y="141" font-size="11" text-anchor="middle" fill="var(--fig-ink)">下品無世族</text><rect x="248" y="27" width="104" height="139" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="300" y="52" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">隋唐以後</text><text x="300" y="82" font-size="12" text-anchor="middle" fill="var(--fig-ink)">科舉</text><path d="M258 95L342 95" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="121" font-size="11" text-anchor="middle" fill="var(--fig-ink)">考試取士，</text><text x="300" y="141" font-size="11" text-anchor="middle" fill="var(--fig-ink)">沿用到清末</text><path d="M114 94L125 94" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#his-selection-arr)"/><path d="M234 94L245 94" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#his-selection-arr)"/><rect x="128" y="181" width="104" height="28" rx="6" fill="var(--fig-sand)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="200" font-size="12" text-anchor="middle" fill="var(--fig-ink)">世族勢力壯大</text></svg>
