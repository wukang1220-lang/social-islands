<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 275" role="img"><title>人類活動導致全球暖化，造成海水面上升、生態衝擊與水旱災。</title><defs><marker id="geo-warming-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--fig-ink)" /></marker></defs><text x="69" y="24" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">人類活動</text><text x="292" y="24" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">影響</text><rect x="8" y="40" width="122" height="42" rx="7" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="69" y="65" font-size="12" text-anchor="middle" fill="var(--fig-ink)">排放溫室氣體</text><path d="M130 61L150 120" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-warming-arr)" /><rect x="8" y="96" width="122" height="42" rx="7" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="69" y="121" font-size="12" text-anchor="middle" fill="var(--fig-ink)">大量砍伐森林</text><path d="M130 117L150 120" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-warming-arr)" /><rect x="8" y="152" width="122" height="42" rx="7" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="69" y="169" font-size="12" text-anchor="middle" fill="var(--fig-ink)">人造建物</text><text x="69" y="186" font-size="12" text-anchor="middle" fill="var(--fig-ink)">覆蓋地表</text><path d="M130 173L150 120" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-warming-arr)" /><rect x="151" y="97" width="58" height="46" rx="7" fill="var(--fig-warm)" stroke="var(--ic)" stroke-width="1.5" /><text x="180" y="116" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">全球</text><text x="180" y="133" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">暖化</text><path d="M210 120L231 62" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-warming-arr)" /><rect x="232" y="37" width="120" height="51" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="292" y="54" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">海水面上升</text><text x="292" y="69" font-size="11" text-anchor="middle" fill="var(--fig-ink)">冰層融化・</text><text x="292" y="83" font-size="11" text-anchor="middle" fill="var(--fig-ink)">海水膨脹</text><path d="M210 120L231 121" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-warming-arr)" /><rect x="232" y="96" width="120" height="51" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="292" y="113" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">生態衝擊</text><text x="292" y="128" font-size="11" text-anchor="middle" fill="var(--fig-ink)">珊瑚白化・</text><text x="292" y="142" font-size="11" text-anchor="middle" fill="var(--fig-ink)">北極熊上岸</text><path d="M210 120L231 180" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-warming-arr)" /><rect x="232" y="155" width="120" height="51" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="292" y="172" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">水旱災頻繁</text><text x="292" y="187" font-size="11" text-anchor="middle" fill="var(--fig-ink)">極端天氣</text><rect x="8" y="219" width="344" height="50" rx="7" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="180" y="240" font-size="11" text-anchor="middle" fill="var(--fig-ink)">1997 京都議定書 → 2015 巴黎協議：</text><text x="180" y="259" font-size="12" text-anchor="