<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img"><title>海洋占地表百分之七十一，七大洲按面積由大到小排列。</title><defs><marker id="geo-landsea-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="geo-landsea-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="180" y1="8" x2="180" y2="252" stroke="var(--fig-line)"/><text x="270" y="22" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none">七大洲（面積由大到小）</text><circle cx="90" cy="113" r="54" fill="var(--fig-land)" stroke="none"/><path d="M90 113L90 59A54 54 0 1 1 37.7 126.4Z" fill="var(--fig-sea)" stroke="none"/><circle cx="90" cy="113" r="30" fill="var(--fig-paper)" stroke="none"/><text x="90" y="199" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none">海洋 71%</text><text x="90" y="222" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none">陸地 29%</text><text x="236" y="57" font-size="11" text-anchor="end" fill="var(--fig-ink)" stroke="none">亞洲</text><rect x="246" y="46" width="100" height="14" rx="2" fill="var(--fig-land)" stroke="none"/><text x="236" y="86" font-size="11" text-anchor="end" fill="var(--fig-ink)" stroke="none">非洲</text><rect x="246" y="75" width="68" height="14" rx="2" fill="var(--fig-land)" stroke="none"/><text x="236" y="115" font-size="11" text-anchor="end" fill="var(--fig-ink)" stroke="none">北美洲</text><rect x="246" y="104" width="54" height="14" rx="2" fill="var(--fig-land)" stroke="none"/><text x="236" y="144" font-size="11" text-anchor="end" fill="var(--fig-ink)" stroke="none">中南美洲</text><rect x="246" y="133" width="46" height="14" rx="2" fill="var(--fig-land)" stroke="none"/><text x="236" y="173" font-size="11" text-anchor="end" fill="var(--fig-ink)" stroke="none">南極洲</text><rect x="246" y="162" width="32" height="14" rx="2" fill="var(--fig-land)" stroke="none"/><text x="236" y="202" font-size="11" text-anchor="end" fill="var(--fig-ink)" stroke="none">歐洲</text><rect x="246" y="191" width="23" height="14" rx="2" fill="var(--fig-land)" stroke="none"/><text x="236" y="231" font-size="11" text-anchor="end" fill="var(--fig-ink)" stroke="none">大洋洲</text><rect x="246" y="220" width="19" height="14" rx="2" fill="var(--fig-land)" stroke="none"/></g></svg>