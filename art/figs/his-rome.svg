<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>羅馬從王政、共和進入帝國，之後分為東西兩部並先後滅亡。</title><line x1="14" y1="24" x2="14" y2="253" stroke="var(--fig-line)" stroke-width="2" /><circle cx="14" cy="20" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="25" y="24" font-size="11" text-anchor="start" fill="var(--fig-ink)">前 8 世紀</text><text x="137" y="24" font-size="11" text-anchor="start" fill="var(--fig-ink)">建立羅馬城（王政）</text><circle cx="14" cy="53" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="25" y="57" font-size="11" text-anchor="start" fill="var(--fig-ink)">前 6 世紀末</text><text x="137" y="57" font-size="11" text-anchor="start" fill="var(--fig-ink)">推翻王政，改行共和</text><circle cx="14" cy="92" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="25" y="96" font-size="11" text-anchor="start" fill="var(--fig-ink)">前 27 年</text><text x="137" y="96" font-size="11" text-anchor="start" fill="var(--fig-ink)">屋大維獲奧古斯都尊號，</text><text x="137" y="111" font-size="11" text-anchor="start" fill="var(--fig-ink)">進入帝國</text><circle cx="14" cy="128" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="25" y="132" font-size="11" text-anchor="start" fill="var(--fig-ink)">前 27～後 180 年</text><text x="137" y="132" font-size="11" text-anchor="start" fill="var(--fig-ink)">羅馬和平</text><circle cx="14" cy="169" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="25" y="173" font-size="11" text-anchor="start" fill="var(--fig-ink)">4 世紀末</text><text x="137" y="173" font-size="11" text-anchor="start" fill="var(--fig-ink)">帝國分為東、西兩部</text><circle cx="14" cy="214" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="25" y="218" font-size="11" text-anchor="start" fill="var(--fig-ink)">476 年</text><text x="137" y="218" font-size="11" text-anchor="start" fill="var(--fig-ink)">西羅馬帝國被</text><text x="137" y="233" font-size="11" text-anchor="start" fill="var(--fig-ink)">日耳曼民族所滅</text><circle cx="14" cy="249" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="25" y="253" font-size="11" text-anchor="start" fill="var(--fig-ink)">1453 年</text><text x="137" y="253" font-size="11" text-anchor="start" fill="var(--fig-ink)">東羅馬帝國被</text><text x="137" y="268" font-size="11" text-anchor="start" fill="var(--fig-ink)">鄂圖曼帝國攻滅</text><path d="M334 46H342V78H334" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="290" y="73" font-size="11" text-anchor="middle" fill="var(--fig-ink)">共和時期</text><path d="M334 83H342V273H334" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="290" y="194" font-size="11" text-anchor="middle" fill="var(--fig-ink)">帝國時期</text></svg>
