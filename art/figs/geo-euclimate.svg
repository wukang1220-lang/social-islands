<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>西風與北大西洋暖流影響歐洲氣候，向東雨量減少且年溫差變大。</title><defs><marker id="geo-euclimate-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--fig-ink)" /></marker></defs><rect x="86" y="28" width="264" height="220" rx="16" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5" /><rect x="87" y="29" width="262" height="31" rx="14" fill="var(--fig-cool)" stroke="none" stroke-width="1.5" /><text x="218" y="49" font-size="13" text-anchor="middle" fill="var(--fig-ink)">寒帶（近北極）</text><text x="151" y="82" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">溫帶海洋性</text><text x="151" y="101" font-size="11" text-anchor="middle" fill="var(--fig-ink)">西歐・北歐西部</text><text x="284" y="82" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">溫帶大陸性</text><text x="284" y="101" font-size="11" text-anchor="middle" fill="var(--fig-ink)">東歐</text><path d="M109 121H329" fill="none" stroke="var(--fig-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-euclimate-arr)" /><text x="218" y="144" font-size="12" text-anchor="middle" fill="var(--fig-ink)">愈往東：雨量減少、</text><text x="218" y="161" font-size="12" text-anchor="middle" fill="var(--fig-ink)">年溫差變大</text><path d="M178 212L196 176L214 212Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="274" y="185" font-size="12" text-anchor="middle" fill="var(--fig-ink)">高地氣候</text><text x="274" y="202" font-size="11" text-anchor="middle" fill="var(--fig-ink)">（阿爾卑斯山）</text><line x1="214" y1="194" x2="225" y2="194" stroke="var(--fig-soft)" stroke-width="1.5" /><rect x="87" y="215" width="262" height="33" rx="6" fill="var(--fig-warm)" stroke="none" stroke-width="1.5" /><text x="218" y="229" font-size="12" text-anchor="middle" fill="var(--fig-ink)">溫帶地中海型（南歐）：</text><text x="218" y="244" font-size="12" text-anchor="middle" fill="var(--fig-ink)">夏乾冬雨</text><path d="M12 92H81" fill="none" stroke="var(--fig-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-euclimate-arr)" /><text x="42" y="77" font-size="13" text-anchor="middle" fill="var(--fig-ink)">西風</text><path d="M75 218Q43 169 72 114" fill="none" stroke="var(--fig-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-euclimate-arr)" /><text x="6" y="155" font-size="11" text-anchor="start" fill="var(--fig-ink)">北大西洋</text><text x="17" y="172" font-size="11" text-anchor="start" fill="var(--fig-ink)">暖流</text><text x="12" y="267" font-size="11" text-anchor="start" fill="var(--fig-ink)">山脈多東西走向，海洋水氣能深入內陸</text><text x="348" y="276" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text></svg>
