<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
<title>交易方式由以物易物演進到貨幣與電子支付並具備四種貨幣功能。</title>
<defs><marker id="civ-money-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="var(--fig-ink)" stroke-width="1.5"/></marker></defs>
<rect x="32" y="7" width="296" height="42" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="24" font-size="13" text-anchor="middle" fill="var(--fig-ink)">以物易物</text>
<text x="180" y="41" font-size="11" text-anchor="middle" fill="var(--fig-ink)">雙方都要剛好需要</text>
<path d="M180 50 L180 57" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-money-arr)"/>
<rect x="32" y="59" width="296" height="42" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="76" font-size="13" text-anchor="middle" fill="var(--fig-ink)">商品貨幣</text>
<text x="180" y="93" font-size="11" text-anchor="middle" fill="var(--fig-ink)">貝殼・白銀・黃金</text>
<path d="M180 102 L180 109" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-money-arr)"/>
<rect x="32" y="111" width="296" height="42" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="128" font-size="13" text-anchor="middle" fill="var(--fig-ink)">法定貨幣</text>
<text x="180" y="145" font-size="11" text-anchor="middle" fill="var(--fig-ink)">紙幣・硬幣，中央銀行發行</text>
<path d="M180 154 L180 161" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-money-arr)"/>
<rect x="32" y="163" width="296" height="42" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="180" font-size="13" text-anchor="middle" fill="var(--fig-ink)">塑膠貨幣・電子支付</text>
<text x="180" y="197" font-size="11" text-anchor="middle" fill="var(--fig-ink)">儲值卡・信用卡</text>
<text x="180" y="232" font-size="13" text-anchor="middle" fill="var(--fig-ink)">貨幣的功能</text>
<rect x="12" y="244" width="78" height="26" rx="7" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="51" y="262" font-size="11" text-anchor="middle" fill="var(--fig-ink)">交易媒介</text>
<rect x="98" y="244" width="78" height="26" rx="7" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="137" y="262" font-size="11" text-anchor="middle" fill="var(--fig-ink)">價值衡量</text>
<rect x="184" y="244" width="78" height="26" rx="7" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="223" y="262" font-size="11" text-anchor="middle" fill="var(--fig-ink)">儲藏價值</text>
<rect x="270" y="244" width="78" height="26" rx="7" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="309" y="262" font-size="11" text-anchor="middle" fill="var(--fig-ink)">清償債務</text>
</svg>
