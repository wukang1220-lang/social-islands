<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img"><title>泉州、漳州與潮州移民各有祖籍信仰，也共享民間信仰。</title><defs><marker id="his-gods-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="his-gods-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="120" y1="12" x2="120" y2="171" stroke="var(--fig-line)"/><line x1="240" y1="12" x2="240" y2="171" stroke="var(--fig-line)"/><path d="M25 63Q42 62 60 42Q78 62 95 63L88 70H32Z" fill="var(--fig-land)" stroke="var(--fig-ink)"/><rect x="35" y="70" width="50" height="29" rx="0" fill="var(--fig-paper)" stroke="var(--fig-ink)"/><rect x="53" y="80" width="14" height="19" rx="0" fill="var(--fig-sand)" stroke="var(--fig-ink)"/><line x1="28" y1="101" x2="92" y2="101" stroke="var(--fig-ink)"/><text x="60" y="127" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">泉州人</text><text x="60" y="151" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">清水祖師</text><path d="M145 63Q162 62 180 42Q198 62 215 63L208 70H152Z" fill="var(--fig-land)" stroke="var(--fig-ink)"/><rect x="155" y="70" width="50" height="29" rx="0" fill="var(--fig-paper)" stroke="var(--fig-ink)"/><rect x="173" y="80" width="14" height="19" rx="0" fill="var(--fig-sand)" stroke="var(--fig-ink)"/><line x1="148" y1="101" x2="212" y2="101" stroke="var(--fig-ink)"/><text x="180" y="127" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">漳州人</text><text x="180" y="151" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">開漳聖王</text><path d="M265 63Q282 62 300 42Q318 62 335 63L328 70H272Z" fill="var(--fig-land)" stroke="var(--fig-ink)"/