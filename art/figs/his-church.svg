<rect x="16" y="160" width="90" height="28" rx="7" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="61" y="179" font-size="13" text-anchor="middle" fill="var(--fig-ink)">新教</text>
<rect x="151" y="160" width="194" height="28" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="248" y="179" font-size="12" text-anchor="middle" fill="var(--fig-ink)">舊教改革：耶穌會</text>
<path d="M61 188 V204 H300 M61 204 V224 M180 204 V224 M300 204 V224" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
