<text x="60" y="244" font-size="12" text-anchor="middle" fill="var(--fig-ink)">路德教派</text>
<rect x="128" y="224" width="104" height="31" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
