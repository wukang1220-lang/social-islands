<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
<title>三個工作選項的報酬比較呈現放棄最高價值選項的機會成本。</title>
<defs><marker id="civ-oppcost-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="var(--fig-ink)" stroke-width="1.5"/></marker></defs>
<text x="180" y="23" font-size="14" text-anchor="middle" fill="var(--fig-ink)">機會成本怎麼算？</text>
<path d="M48 55 V77 M48 106 V129 M48 184 V206" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="51" font-size="12" text-anchor="start" fill="var(--fig-ink)">發傳單 230 元</text>
<text x="324" y="51" font-size="12" text-anchor="middle" fill="var(--fig-ink)">選擇</text>
<rect x="48" y="59" width="276" height="15" rx="2" fill="var(--ic)" stroke="none" stroke-width="1.5"/>
<text x="48" y="102" font-size="12" text-anchor="start" fill="var(--fig-ink)">超商 220 元</text>
<rect x="48" y="110" width="264" height="16" rx="2" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="3"/>
<path d="M180 127 L180 134" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="151" font-size="12" text-anchor="middle" fill="var(--fig-ink)">機會成本＝220 元（放棄的最高者）</text>
<text x="48" y="180" font-size="12" text-anchor="start" fill="var(--fig-soft)">餐廳 210 元</text>
<g opacity="0.4"><rect x="48" y="188" width="252" height="15" rx="2" fill="var(--fig-soft)" stroke="none" stroke-width="1.5"/></g>
<text x="48" y="224" font-size="11" text-anchor="middle" fill="var(--fig-soft)">0</text>
<rect x="10" y="237" width="340" height="36" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="251" font-size="12" text-anchor="middle" fill="var(--fig-ink)">機會成本＝放棄的選項中價值最高者</text>
<text x="180" y="267" font-size="12" text-anchor="middle" fill="var(--fig-ink)">＋實際多花的成本</text>
</svg>
