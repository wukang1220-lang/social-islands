<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>人口遷移的推力、拉力與遷移類型。</title><defs><marker id="geo-pushpull-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="10" y="10" width="140" height="139" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="80" y="31" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">原居地</text><text x="80" y="58" font-size="12" text-anchor="middle" fill="var(--fig-ink)">推力（想離開）</text><text x="80" y="84" font-size="12" text-anchor="middle" fill="var(--fig-ink)">工作機會少</text><text x="80" y="108" font-size="12" text-anchor="middle" fill="var(--fig-ink)">生活環境差</text><text x="80" y="132" font-size="12" text-anchor="middle" fill="var(--fig-ink)">治安不好</text><rect x="210" y="10" width="140" height="139" rx="6" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="280" y="31" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">遷入地</text><text x="280" y="58" font-size="12" text-anchor="middle" fill="var(--fig-ink)">拉力（想移入）</text><text x="280" y="84" font-size="12" text-anchor="middle" fill="var(--fig-ink)">工作機會多</text><text x="280" y="108" font-size="12" text-anchor="middle" fill="var(--fig-ink)">生活機能強</text><text x="280" y="132" font-size="12" text-anchor="middle" fill="var(--fig-ink)">教育治安好</text><text x="180" y="48" font-size="12" text-anchor="middle" fill="var(--fig-ink)">遷移</text><path d="M157 72L203 72" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-pushpull-arr)"/><rect x="10" y="161" width="340" height="106" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M10 194L350 194" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 2