<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
<title>刑事訴訟依偵查、起訴、審判與執行進行並可能作成不起訴處分。</title>
<defs><marker id="civ-crimproc-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<text x="180" y="21" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">刑事訴訟四階段</text>
<rect x="10" y="32" width="216" height="25" rx="5" fill="var(--fig-sand)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="118" y="50" font-size="12" text-anchor="middle" fill="var(--fig-ink)">開始：告訴・告發・自首</text>
<path d="M118 58V65" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-crimproc-arr)"/>
<rect x="10" y="68" width="216" height="37" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<path d="M62 74V99" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="90.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">偵查</text>
<text x="73" y="82" font-size="11.5" text-anchor="start" fill="var(--fig-ink)">檢察官指揮</text>
<text x="73" y="98" font-size="11.5" text-anchor="start" fill="var(--fig-ink)">司法警察</text>
<rect x="10" y="119" width="216" height="48" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<path d="M62 125V161" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="147.0" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">起訴</text>
<text x="73" y="133" font-size="11.5" text-anchor="start" fill="var(--fig-ink)">公訴（檢察官）・</text>
<text x="73" y="149" font-size="11.5" text-anchor="start" fill="var(--fig-ink)">自訴（委任律師）</text>
<rect x="10" y="182" width="216" height="37" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<path d="M62 188V213" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="204.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">審判</text>
<text x="73" y="196" font-size="11.5" text-anchor="start" fill="var(--fig-ink)">法官依法審判・</text>
<text x="73" y="212" font-size="11.5" text-anchor="start" fill="var(--fig-ink)">無罪推定</text>
<rect x="10" y="233" width="216" height="36" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<path d="M62 239V263" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="255.0" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">執行</text>
<text x="73" y="257" font-size="11.5" text-anchor="start" fill="var(--fig-ink)">檢察官指揮執行</text>
<path d="M118 106V116" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-crimproc-arr)"/>
<path d="M118 168V179" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-crimproc-arr)"/>
<path d="M118 220V230" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-crimproc-arr)"/>
<rect x="244" y="32" width="106" height="144" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="297" y="53" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">誰管？</text>
<text x="297" y="75" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">警察：內政部</text>
<text x="297" y="113" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">檢察官：法務部</text>
<text x="297" y="151" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">法官：司法院</text>
<path d="M226 143H236V214H242" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-crimproc-arr)"/>
<rect x="244" y="191" width="106" height="57" rx="5" fill="var(--fig-sand)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="297" y="213" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">證據不足</text>
<text x="297" y="233" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">→ 不起訴處分</text>
</svg>
