<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img"><title>憲法保障平等權、自由權、受益權與參政權。</title><defs><marker id="civ-rights4-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="10" y="12" width="164" height="106" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="92" y="40" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">平等權</text><path d="M24 52L160 52" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="75" font-size="12" text-anchor="middle" fill="var(--fig-ink)">法律上一律平等</text><rect x="186" y="12" width="164" height="106" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="268" y="40" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">自由權</text><path d="M200 52L336 52" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="268" y="75" font-size="12" text-anchor="middle" fill="var(--fig-ink)">防止國家不當干涉</text><rect x="10" y="127" width="164" height="106" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="92" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">受益權</text><path d="M24 167L160 167" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="190" font-size="12" text-anchor="middle" fill="var(--fig-ink)">要求國家有所作為</text><text x="92" y="212" font-size="12" text-anchor="middle" fill="var(--fig-ink)">（請願・訴願・訴訟）</text><rect x="186" y="127" width="164" height="106" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="268" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">參政權</text><path d="M200 167L336