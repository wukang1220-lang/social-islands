<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>臺灣史前時代的石器與金屬器文化沿距今年代排列並有時期重疊。</title><defs><marker id="his-prehist-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="his-prehist-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="38" x2="58" y2="38" stroke="var(--fig-soft)"/><path d="M59 35L64 41L69 35L74 41" fill="none" stroke="var(--fig-soft)"/><path d="M77 38H346" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-prehist-arr)"/><line x1="25" y1="33" x2="25" y2="43" stroke="var(--fig-soft)"/><text x="9" y="19" font-size="11" text-anchor="start" fill="var(--fig-ink)" stroke="none">距今 50,000 年</text><line x1="169" y1="33" x2="169" y2="43" stroke="var(--fig-soft)"/><text x="169" y="21" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">7,000</text><line x1="221" y1="33" x2="221" y2="43" stroke="var(--fig-soft)"/><text x="221" y="21" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">5,000</text><line x1="299" y1="33" x2="299" y2="43" stroke="var(--fig-soft)"/><text x="299" y="21" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">2,000</text><line x1="340" y1="33" x2="340" y2="43" stroke="var(--fig-soft)"/><text x="340" y="21" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">400</text><rect x="25" y="60" width="196" height="13" rx="3" fill="var(--fig-sand)" stroke="none"/><text x="104" y="94" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">舊石器時代</text><text x="104" y="114" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">長濱文化</text><text x="104" y="134" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">打製石器</text><rect x="169" y="146" width="130" height="13" rx="3" fill="var(--fig-land)" stroke="none"/><text x="234" y="179" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">新石器時代</text><text x="234" y="199" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">大坌坑・圓山・卑南文化</text><text x="234" y="219" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">磨製石器・陶器</text><rect x="299" y="235" width="41" height="12" rx="3" fill="var(--fig-sea)" stroke="none"/><text x="229" y="250" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">金屬器時代</text><line x1="277" y1="244" x2="298" y2="241" stroke="var(--fig-soft)"/><text x="245" y="273" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">十三行文化</text><text x="325" y="273" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">鐵器</text><line x1="25" y1="44" x2="25" y2="60" stroke="var(--fig-line)" stroke-dasharray="3 4"/><line x1="221" y1="44" x2="221" y2="60" stroke="var(--fig-line)" stroke-dasharray="3 4"/><line x1="169" y1="44" x2="169" y2="146" stroke="var(--fig-line)" stroke-dasharray="3 4"/><line x1="299" y1="44" x2="299" y2="146" stroke="var(--fig-line)" stroke-dasharray="3 4"/><line x1="340" y1="44" x2="340" y2="235" stroke="var(--fig-line)" stroke-dasharray="3 4"/></g></svg>