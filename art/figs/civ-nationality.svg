<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>取得國籍的方式包括血統主義、出生地主義與歸化。</title><defs><marker id="civ-nationality-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="civ-nationality-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="107" y="10" width="146" height="34" rx="7" fill="var(--fig-land)" stroke="var(--fig-line)"/><text x="180" y="32" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none">取得國籍的方式</text><line x1="180" y1="44" x2="180" y2="62" stroke="var(--fig-soft)"/><line x1="60" y1="62" x2="300" y2="62" stroke="var(--fig-soft)"/><path d="M60 62V81" fill="none" stroke="var(--fig-ink)" marker-end="url(#civ-nationality-arr)"/><path d="M180 62V81" fill="none" stroke="var(--fig-ink)" marker-end="url(#civ-nationality-arr)"/><path d="M300 62V81" fill="none" stroke="var(--fig-ink)" marker-end="url(#civ-nationality-arr)"/><rect x="8" y="84" width="104" height="181" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)"/><rect x="128" y="84" width="104" height="181" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)"/><rect x="248" y="84" width="104" height="181" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)"/><text x="60" y="107" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="60" y="107">血統主義</tspan><tspan x="60" y="124">（屬人）</tspan></text><text x="60" y="161" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="60" y="161">父或母是</tspan><tspan x="60" y="178">本國人</tspan></text><text x="60" y="222" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="60" y="222">我國、多數</tspan><tspan x="60" y="239">歐洲國家</tspan></text><text x="180" y="107" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="180" y="107">出生地主義</tspan><tspan x="180" y="124">（屬地）</tspan></text><text x="180" y="161" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="180" y="161">在該國領土</tspan><tspan x="180" y="178">出生</tspan></text><text x="180" y="222" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">美國</text><text x="300" y="107" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">歸化</text><text x="300" y="161" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="300" y="161">婚姻、收養、</tspan><tspan x="300" y="178">投資移民</tspan></text><text x="300" y="222" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">例：新住民</text></g></svg>