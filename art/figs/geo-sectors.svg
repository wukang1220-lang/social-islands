<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img"><title>三級產業的工作內容與產業比例。</title><defs><marker id="geo-sectors-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><text x="60" y="28" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">第一級產業</text><path d="M60 98V59M60 78Q35 76 40 59Q60 60 60 78M60 88Q85 85 80 68Q60 69 60 88" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="127" font-size="12" text-anchor="middle" fill="var(--fig-ink)">直接取用</text><text x="60" y="144" font-size="12" text-anchor="middle" fill="var(--fig-ink)">自然資源</text><text x="60" y="175" font-size="11" text-anchor="middle" fill="var(--fig-ink)">農、林、漁、牧</text><path d="M120 10L120 211" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="28" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">第二級產業</text><path d="M154 98V73L171 62V73L188 62V76H204V98Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="192" y="48" width="9" height="28" rx="0" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="180" y="127" font-size="12" text-anchor="middle" fill="var(--fig-ink)">原料加工製造</text><text x="180" y="175" font-size="11" text-anchor="middle" fill="var(--fig-ink)">紡織、食品加工、</text><text x="180" y="192" font-size="11" text-anchor="middle" fill="var(--fig-ink)">鋼鐵</text><path d="M240 10L240 211" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="28" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">第三級產業</text><path d="M273 69L280 52H320L327 69ZM277 69V98H323V69" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="293" y="79" width="14" height="19" rx="0" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="300" y="127" font-size="12" text-anchor="middle" fill="var(--fig-ink)">提供買賣與服務</text><text x="300" y="175" font-size="11" text-anchor="middle" fill="var(--fig-ink)">商業、運輸、</text><text x="300" y="192" font-size="11" text-anchor="middle" fill="var(--fig-ink)">觀光、金融</text><path d="M103 110L137 110" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-sectors-arr)"/><path d="M223 110L257 110" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-sectors-arr)"/><rect x="10" y="218" width="340" height="26" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="235" font-size="12" text-anchor="middle" fill="var(--fig-ink)">經濟越發達，第二、三級產業比例越高</text></svg>
