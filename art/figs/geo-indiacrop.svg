<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" role="img">
<title>印度農作物分布受到東西雨量差異與西南季風的影響。</title>
<defs><marker id="geo-indiacrop-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<text x="180" y="21" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">印度大平原</text>
<text x="12" y="48" font-size="12" text-anchor="start" fill="var(--fig-ink)">西</text>
<text x="348" y="48" font-size="12" text-anchor="end" fill="var(--fig-ink)">東</text>
<text x="180" y="47" font-size="12" text-anchor="middle" fill="var(--fig-ink)">雨量由東向西遞減</text>
<path d="M294 60L51 60" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#geo-indiacrop-arr)"/>
<rect x="24" y="75" width="242" height="42" rx="4" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="65" y="102" font-size="13" text-anchor="middle" fill="var(--fig-ink)">小麥</text>
<text x="147" y="102" font-size="13" text-anchor="middle" fill="var(--fig-ink)">稻米</text>
<text x="229" y="102" font-size="13" text-anchor="middle" fill="var(--fig-ink)">黃麻</text>
<path d="M272 116Q283 83 297 103Q309 76 327 116Z" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="303" y="132" font-size="11" text-anchor="middle" fill="var(--fig-ink)">東北部丘陵：</text>
<text x="303" y="148" font-size="11" text-anchor="middle" fill="var(--fig-ink)">茶</text>
<line x1="8" y1="158" x2="352" y2="158" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="179" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">德干高原</text>
<text x="14" y="199" font-size="12" text-anchor="start" fill="var(--fig-ink)">西</text>
<text x="346" y="199" font-size="12" text-anchor="end" fill="var(--fig-ink)">東</text>
<rect x="8" y="237" width="87" height="22" rx="0" fill="var(--fig-sea)" stroke="none" stroke-width="1.5"/>
<path d="M87 237L112 202L133 218L340 246L340 259L87 259Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="50" y="218" font-size="11" text-anchor="middle" fill="var(--fig-ink)">西南季風</text>
<path d="M20 230Q66 232 102 210" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#geo-indiacrop-arr)"/>
<text x="149" y="199" font-size="11" text-anchor="middle" fill="var(--fig-ink)">迎風坡：多雨</text>
<line x1="133" y1="203" x2="117" y2="211" stroke="var(--fig-soft)" stroke-width="1.5"/>
<text x="268" y="216" font-size="11" text-anchor="middle" fill="var(--fig-ink)">背風側：較乾燥</text>
<text x="233" y="244" font-size="12" text-anchor="middle" fill="var(--fig-ink)">棉花</text>
<text x="348" y="269" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text>
</svg>
