<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 277" role="img"><title>澳洲由西部高原經中部平原至大分水嶺，東南信風使迎風坡多雨。</title><defs><marker id="geo-ausprofile-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--fig-ink)" /></marker></defs><text x="88" y="26" font-size="12" text-anchor="middle" fill="var(--fig-ink)">沙漠廣布・礦產豐富</text><text x="270" y="26" font-size="12" text-anchor="middle" fill="var(--fig-ink)">人口集中</text><text x="270" y="44" font-size="11" text-anchor="middle" fill="var(--fig-ink)">（雪梨・布里斯班）</text><rect x="296" y="179" width="52" height="28" rx="0" fill="var(--fig-sea)" stroke="none" stroke-width="1.5" /><path d="M12 148H115L130 175H216L230 151L247 98L265 179H296V207H12Z" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 148H115L130 175V207H12Z" fill="var(--fig-sand)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M216 175L230 151L247 98L265 179V207H216Z" fill="var(--fig-sand)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="109" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">西部高原</text><text x="165" y="140" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">中部平原</text><text x="247" y="79" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">大分水嶺</text><text x="177" y="79" font-size="11" text-anchor="middle" fill="var(--fig-ink)">背風坡：</text><text x="177" y="96" font-size="11" text-anchor="middle" fill="var(--fig-ink)">乾燥</text><path d="M345 116Q298 108 267 137" fill="none" stroke="var(--fig-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-ausprofile-arr)" /><text x="316" y="98" font-size="11" text-anchor="middle" fill="var(--fig-ink)">東南信風</text><text x="305" y="155" font-size="11" text-anchor="middle" fill="var(--fig-ink)">迎風坡：</text><text x="305" y="172" font-size="11" text-anchor="middle" fill="var(--fig-ink)">多雨</text><line x1="280" y1="182" x2="286" y2="202" stroke="var(--fig-soft)" stroke-width="1.5" /><text x="298" y="221" font-size="12" text-anchor="middle" fill="var(--fig-ink)">東南沿海平原</text><text x="12" y="247" font-size="13" text-anchor="start" fill="var(--fig-ink)">西</text><text x="348" y="247" font-size="13" text-anchor="end" fill="var(--fig-ink)">東</text><text x="348" y="271" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text></svg>
