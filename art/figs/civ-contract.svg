<rect x="144" y="9" width="72" height="31" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="30" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">民法</text>
<path d="M180 40V49H90V60" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-contract-arr)"/>
