<text x="270" y="108" font-size="12" text-anchor="middle" fill="var(--fig-ink)">買賣・租賃・借貸</text>
<rect x="22" y="153" width="69" height="66" rx="5" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="56.5" y="191" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">買方</text>
