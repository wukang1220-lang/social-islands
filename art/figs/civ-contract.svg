<path d="M103 169H257" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-contract-arr)"/>
<text x="180" y="198" font-size="12" text-anchor="middle" fill="var(--fig-ink)">商品</text>
<path d="M257 209H103" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-contract-arr)"/>
<text x="180" y="245" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">意思表示一致 → 契約成立</text>
<text x="180" y="267" font-size="12" text-anchor="middle" fill="var(--fig-soft)">履行完畢 → 債的關係消滅</text>
