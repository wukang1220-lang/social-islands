<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img">
<title>清末與民初的婦女及兒童在教育、就業、參政與生活上有所變化。</title>
<defs><marker id="his-women-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<text x="180" y="24" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">社會變遷：婦女與兒童</text>
<rect x="10" y="38" width="340" height="223" rx="0" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<rect x="10" y="38" width="340" height="31" rx="0" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<path d="M54 38V261" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M202 38V261" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M10 69H350" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M10 117H350" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M10 165H350" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M10 213H350" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="59" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">清末</text>
<text x="276" y="59" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">民初</text>
<text x="32" y="98" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">教育</text>
<text x="128" y="98" font-size="12" text-anchor="middle" fill="var(--fig-ink)">女子學堂</text>
<text x="276" y="89" font-size="12" text-anchor="middle" fill="var(--fig-ink)">男女同校、</text>
<text x="276" y="107" font-size="12" text-anchor="middle" fill="var(--fig-ink)">女性讀大學</text>
<text x="32" y="146" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">就業</text>
<text x="128" y="146" font-size="12" text-anchor="middle" fill="var(--fig-ink)">進工廠當女工</text>
<text x="276" y="137" font-size="12" text-anchor="middle" fill="var(--fig-ink)">公營機關、</text>
<text x="276" y="155" font-size="12" text-anchor="middle" fill="var(--fig-ink)">女教授、創業</text>
<text x="32" y="194" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">參政</text>
<text x="128" y="194" font-size="12" text-anchor="middle" fill="var(--fig-ink)">秋瑾參加革命</text>
<text x="276" y="185" font-size="12" text-anchor="middle" fill="var(--fig-ink)">爭取參政權、</text>
<text x="276" y="203" font-size="12" text-anchor="middle" fill="var(--fig-ink)">參加五四遊行</text>
<text x="32" y="242" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">兒童</text>
<text x="128" y="242" font-size="12" text-anchor="middle" fill="var(--fig-ink)">蒙養院</text>
<text x="276" y="242" font-size="12" text-anchor="middle" fill="var(--fig-ink)">幼稚園、兒童文學</text>
