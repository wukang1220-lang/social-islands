<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>領海與經濟海域以領海基線向外劃設，圖中距離未依比例。</title><defs><marker id="geo-sea-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="geo-sea-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="72" width="62" height="78" rx="0" fill="var(--fig-land)" stroke="var(--fig-line)"/><rect x="70" y="72" width="65" height="78" rx="0" fill="var(--fig-sea)" stroke="var(--fig-line)"/><rect x="135" y="72" width="140" height="78" rx="0" fill="var(--fig-cool)" stroke="var(--fig-line)"/><rect x="275" y="72" width="77" height="78" rx="0" fill="var(--fig-sea)" stroke="var(--fig-line)"/><line x1="70" y1="57" x2="70" y2="155" stroke="var(--fig-ink)"/><text x="70" y="43" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">領海基線</text><text x="38" y="108" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">陸地</text><text x="102" y="99" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">領海</text><text x="102" y="125" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">視同領土</text><text x="205" y="99" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">經濟海域</text><text x="205" y="125" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">漁業、礦產權利</text><text x="313" y="108" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">公海</text><line x1="70" y1="170" x2="275" y2="170" stroke="var(--fig-soft)"/><line x1="70" y1="165" x2="70" y2="176" stroke="var(--fig-soft)"/><text x="70" y="192" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">0</text><line x1="135" y1="165" x2="135" y2="176" stroke="var(--fig-soft)"/><text x="135" y="192" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">12 浬</text><line x1="275" y1="165" x2="275" y2="176" stroke="var(--fig-soft)"/><text x="275" y="192" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">200 浬</text><text x="350" y="211" font-size="11" text-anchor="end" fill="var(--fig-soft)" stroke="none">示意圖（未依比例）</text></g></svg>