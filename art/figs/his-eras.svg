<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img"><title>西元、帝王、民國與干支紀年各有不同的計年方式。</title><defs><marker id="his-eras-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="his-eras-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="164" height="115" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)"/><text x="90" y="34" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none" font-weight="600">西元紀年</text><text x="90" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="90" y="67">10 年＝一個年代</tspan><tspan x="90" y="90">100 年＝一世紀</tspan></text><rect x="188" y="8" width="164" height="115" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)"/><text x="270" y="34" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none" font-weight="600">帝王紀年</text><text x="270" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="270" y="67">用年號</tspan><tspan x="270" y="90">光緒 10 年＝1884 年</tspan></text><rect x="8" y="137" width="164" height="115" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)"/><text x="90" y="163" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none" font-weight="600">民國紀年</text><text x="90" y="196" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="90" y="196">1912 年＝民國元年</tspan><tspan x="90" y="219">民國年＋1911＝西元年</tspan></text><rect x="188" y="137" width="164" height="115" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)"/><text x="270" y="163" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none" font-weight="600">干支紀年</text><text x="270" y="196" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="270" y="196">10 天干配 12 地支</tspan><tspan x="270" y="219">60 年一循環</tspan></text></g></svg>