<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img"><title>日本面對成本與人口問題，從國外與國內調整產業。</title><defs><marker id="geo-japanshift-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="10" y="85" width="127" height="96" rx="6" fill="var(--fig-sand)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="73" y="108" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">問題</text><text x="73" y="132" font-size="11" text-anchor="middle" fill="var(--fig-ink)">薪資高漲・</text><text x="73" y="150" font-size="11" text-anchor="middle" fill="var(--fig-ink)">成本增加</text><text x="73" y="168" font-size="11" text-anchor="middle" fill="var(--fig-ink)">人口老化・勞力不足</text><path d="M139 115H155V58H174" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-japanshift-arr)"/><path d="M139 151H155V194H174" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-japanshift-arr)"/><rect x="180" y="17" width="170" height="97" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="265" y="39" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">國外</text><text x="265" y="64" font-size="12" text-anchor="middle" fill="var(--fig-ink)">勞力密集產業移往</text><text x="265" y="83" font-size="12" text-anchor="middle" fill="var(--fig-ink)">中國、東南亞</text><text x="265" y="102" font-size="12" text-anchor="middle" fill="var(--fig-ink)">企業國際化</text><rect x="180" y="143" width="170" height="97" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="265" y="165" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">國內</text><text x="265" y="190" font-size="12" text-anchor="middle" fill="var(--fig-ink)">技術研發、專利獲利</text><text x="265" y="209