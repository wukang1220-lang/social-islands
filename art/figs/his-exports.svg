<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 255" role="img"><title>開港後茶、糖與樟腦由不同產地經港口輸往海外。</title><defs><marker id="his-exports-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="his-exports-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><text x="180" y="22" font-size="13" text-anchor="middle" fill="var(--fig-ink)" stroke="none" font-weight="600">開港後的三大出口品</text><rect x="8" y="44" width="43" height="37" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)"/><text x="29.5" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">茶</text><text x="87" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">北部</text><path d="M54 63H62" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><path d="M111 63H126" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><path d="M246 63H268" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><text x="188" y="59" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="188" y="59">大稻埕加工・</tspan><tspan x="188" y="76">淡水出口</tspan></text><text x="312" y="59" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="312" y="59">美國、</tspan><tspan x="312" y="76">東南亞</tspan></text><line x1="8" y1="102" x2="352" y2="102" stroke="var(--fig-line)"/><rect x="8" y="118" width="43" height="37" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)"/><text x="29.5" y="141" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">糖</text><text x="87" y="141" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">南部</text><path d="M54 137H62" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><path d="M111 137H126" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><path d="M246 137H268" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><text x="188" y="141" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="188" y="141">安平、打狗</tspan></text><text x="312" y="141" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="312" y="141">日本</tspan></text><line x1="8" y1="176" x2="352" y2="176" stroke="var(--fig-line)"/><rect x="8" y="192" width="43" height="37" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)"/><text x="29.5" y="215" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">樟腦</text><text x="87" y="215" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">中北部</text><path d="M54 211H62" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><path d="M111 211H126" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><path d="M246 211H268" fill="none" stroke="var(--fig-ink)" marker-end="url(#his-exports-arr)"/><text x="188" y="215" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="188" y="215">淡水</tspan></text><text x="312" y="215" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="312" y="215">歐美</tspan></text></g></svg>