<rect x="12" y="12" width="138" height="138" rx="0" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/>
<path d="M13 13L149 13L149 67Q115 88 91 70T54 82Q28 112 13 91Z" fill="var(--fig-warm)" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
