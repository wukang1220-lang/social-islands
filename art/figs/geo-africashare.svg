<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
<title>漠南非洲人口與經濟占全球的比例不同且面臨多項挑戰。</title>
<defs><marker id="geo-africashare-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<text x="180" y="22" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">漠南非洲占全球的比例</text>
<text x="331" y="42" font-size="11" text-anchor="end" fill="var(--fig-soft)">全球 100%</text>
