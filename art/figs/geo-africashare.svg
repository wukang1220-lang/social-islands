<text x="195" y="192" font-size="12" text-anchor="start" fill="var(--fig-ink)">政局不穩</text>
<text x="195" y="217" font-size="12" text-anchor="start" fill="var(--fig-ink)">水電交通不足</text>
<text x="195" y="242" font-size="12" text-anchor="start" fill="var(--fig-ink)">糧食短缺・環境破壞</text>
<text x="195" y="267" font-size="12" text-anchor="start" fill="var(--fig-ink)">公共衛生不佳</text>
