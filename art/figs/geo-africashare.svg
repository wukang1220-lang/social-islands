<rect x="81" y="50" width="250" height="20" rx="0" fill="var(--fig-line)" stroke="none" stroke-width="1.5"/>
<rect x="81" y="50" width="37.5" height="20" rx="0" fill="var(--ic)" stroke="none" stroke-width="1.5"/>
<text x="131" y="65" font-size="12" text-anchor="start" fill="var(--fig-ink)">約 15%</text>
<text x="331" y="97" font-size="11" text-anchor="end" fill="var(--fig-soft)">全球 100%</text>
<text x="18" y="120" font-size="12" text-anchor="start" fill="var(--fig-ink)">GDP</text>
<rect x="81" y="105" width="250" height="20" rx="0" fill="var(--fig-line)" stroke="none" stroke-width="1.5"/>
<rect x="81" y="105" width="5" height="20" rx="0" fill="var(--ic)" stroke="none" stroke-width="1.5"/>
<text x="131" y="120" font-size="12" text-anchor="start" fill="var(--fig-ink)">約 2%</text>
<line x1="8" y1="142" x2="352" y2="142" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="25" y="164" font-size="14" text-anchor="start" fill="var(--fig-ink)" font-weight="600">優勢</text>
<text x="195" y="164" font-size="14" text-anchor="start" fill="var(--fig-ink)" font-weight="600">挑戰</text>
<line x1="180" y1="153" x2="180" y2="265" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="25" y="192" font-size="12" text-anchor="start" fill="var(--fig-ink)">勞動力充足低廉</text>
