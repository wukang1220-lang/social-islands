<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 277" role="img"><title>世界歷史依時代特性分為上古、古典、中世紀、近代、十九世紀與現代。</title><text x="180" y="21" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">世界歷史的分期</text><line x1="16" y1="43" x2="16" y2="225" stroke="var(--fig-line)" stroke-width="2" /><circle cx="16" cy="41" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="29" y="45" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">上古</text><text x="112" y="45" font-size="11" text-anchor="start" fill="var(--fig-soft)">約前 3500～前 500 年</text><text x="29" y="62" font-size="11" text-anchor="start" fill="var(--fig-ink)">兩河、尼羅河流域發明文字</text><line x1="29" y1="68" x2="348" y2="68" stroke="var(--fig-line)" stroke-width="1.5" /><circle cx="16" cy="76" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="29" y="80" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">古典</text><text x="112" y="80" font-size="11" text-anchor="start" fill="var(--fig-soft)">約前 500～後 500 年</text><text x="29" y="97" font-size="11" text-anchor="start" fill="var(--fig-ink)">希臘羅馬文化・基督教誕生</text><line x1="29" y1="103" x2="348" y2="103" stroke="var(--fig-line)" stroke-width="1.5" /><circle cx="16" cy="111" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="29" y="115" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">中世紀</text><text x="112" y="115" font-size="11" text-anchor="start" fill="var(--fig-soft)">約 500～1500 年</text><text x="29" y="132" font-size="11" text-anchor="start" fill="var(--fig-ink)">拜占庭、伊斯蘭世界、西歐基督教世界</text><line x1="29" y1="138" x2="348" y2="138" stroke="var(--fig-line)" stroke-width="1.5" /><circle cx="16" cy="146" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="29" y="150" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">近代</text><text x="112" y="150" font-size="11" text-anchor="start" fill="var(--fig-soft)">約 1500～1800 年</text><text x="29" y="167" font-size="11" text-anchor="start" fill="var(--fig-ink)">科學革命・啟蒙運動・美法革命</text><line x1="29" y1="173" x2="348" y2="173" stroke="var(--fig-line)" stroke-width="1.5" /><circle cx="16" cy="181" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="29" y="185" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">19 世紀</text><text x="112" y="185" font-size="11" text-anchor="start" fill="var(--fig-soft)" /><text x="29" y="202" font-size="11" text-anchor="start" fill="var(--fig-ink)">帝國主義國家海外擴張</text><line x1="29" y1="208" x2="348" y2="208" stroke="var(--fig-line)" stroke-width="1.5" /><circle cx="16" cy="216" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5" /><text x="29" y="220" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">現代</text><text x="112" y="220" font-size="11" text-anchor="start" fill="var(--fig-soft)">20 世紀</text><text x="29" y="237" font-size="11" text-anchor="start" fill="var(--fig-ink)">兩次世界大戰・冷戰</text><text x="348" y="270" font-size="11" text-anchor="end" fill="var(--fig-soft)">依「時代特性」畫分</text></svg>
