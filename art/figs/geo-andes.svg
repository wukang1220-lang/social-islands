<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img"><title>安地斯山區隨海拔升高氣溫降低，形成作物、草原與冰雪的垂直分帶。</title><defs><marker id="geo-andes-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--fig-ink)" /></marker></defs><text x="180" y="21" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">安地斯山區的垂直變化</text><path d="M17 230V44" fill="none" stroke="var(--fig-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-andes-arr)" /><text x="29" y="49" font-size="11" text-anchor="start" fill="var(--fig-ink)">海拔升高，</text><text x="29" y="65" font-size="11" text-anchor="start" fill="var(--fig-ink)">氣溫降低</text><path d="M38 230L55 192H152L168 230Z" fill="var(--fig-warm)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M55 192L72 153H136L152 192Z" fill="var(--fig-land)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M72 153L89 113H119L136 153Z" fill="var(--fig-sand)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M89 113L105 78L119 113Z" fill="var(--fig-cool)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 230L105 78L168 230Z" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="119" y1="103" x2="183" y2="103" stroke="var(--fig-soft)" stroke-width="1.5" /><line x1="128" y1="137" x2="183" y2="137" stroke="var(--fig-soft)" stroke-width="1.5" /><line x1="146" y1="180" x2="183" y2="180" stroke="var(--fig-soft)" stroke-width="1.5" /><line x1="162" y1="216" x2="183" y2="216" stroke="var(--fig-soft)" stroke-width="1.5" /><text x="196" y="107" font-size="13" text-anchor="start" fill="var(--fig-ink)">冰雪</text><text x="196" y="135" font-size="12" text-anchor="start" fill="var(--fig-ink)">高山草原：</text><t