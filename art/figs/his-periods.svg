<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img"><title>臺灣歷史以史前、大航海、清帝國、日治及中華民國時期呈現。</title><defs><marker id="his-periods-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)" stroke="none"/></marker><marker id="his-periods-sun" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-warm)" stroke="none"/></marker></defs><g fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><text x="8" y="21" font-size="11" text-anchor="start" fill="var(--fig-ink)" stroke="none">史前時代（沒有文字紀錄）</text><path d="M9 40V33H65V40" fill="none" stroke="var(--fig-soft)"/><text x="215" y="47" font-size="12" text-anchor="middle" fill="var(--fig-ink)" stroke="none">歷史時代</text><path d="M65 68V58H351V68" fill="none" stroke="var(--fig-soft)"/><rect x="8" y="83" width="57" height="79" rx="0" fill="var(--fig-land)" stroke="var(--fig-line)"/><text x="36.5" y="105" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="36.5" y="105">史前</tspan><tspan x="36.5" y="122">時代</tspan></text><rect x="65" y="83" width="62" height="79" rx="0" fill="var(--fig-sea)" stroke="var(--fig-line)"/><text x="96" y="105" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="96" y="105">大航海</tspan><tspan x="96" y="122">時代</tspan></text><rect x="127" y="83" width="108" height="79" rx="0" fill="var(--fig-sand)" stroke="var(--fig-line)"/><text x="181" y="105" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="181" y="105">清帝國時期</tspan></text><rect x="235" y="83" width="51" height="79" rx="0" fill="var(--fig-cool)" stroke="var(--fig-line)"/><text x="260.5" y="105" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="260.5" y="105">日治</tspan><tspan x="260.5" y="122">時期</tspan></text><rect x="286" y="83" width="66" height="79" rx="0" fill="var(--fig-land)" stroke="var(--fig-line)"/><text x="319" y="105" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none"><tspan x="319" y="105">中華民國</tspan><tspan x="319" y="122">時期</tspan></text><text x="37" y="149" font-size="14" text-anchor="middle" fill="var(--fig-ink)" stroke="none">≈</text><line x1="202" y1="119" x2="202" y2="162" stroke="var(--fig-soft)"/><text x="164" y="142" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">開港前</text><text x="217" y="142" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">開港後</text><line x1="65" y1="163" x2="65" y2="171" stroke="var(--fig-soft)"/><text x="65" y="186" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">約 400 年前</text><line x1="127" y1="163" x2="127" y2="171" stroke="var(--fig-soft)"/><text x="127" y="186" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">1684</text><line x1="235" y1="163" x2="235" y2="171" stroke="var(--fig-soft)"/><text x="235" y="186" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">1895</text><line x1="286" y1="163" x2="286" y2="171" stroke="var(--fig-soft)"/><text x="286" y="186" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">1945</text><line x1="202" y1="163" x2="202" y2="197" stroke="var(--fig-soft)"/><text x="202" y="212" font-size="11" text-anchor="middle" fill="var(--fig-ink)" stroke="none">1860</text></g></svg>