<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
  <title>冷戰的兩大軍事集團、第三世界、衝突及結束過程。</title>
  <defs><marker id="his-coldwar2-arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5" fill="var(--fig-ink)"/></marker></defs>
  <rect x="10" y="10" width="165" height="58" rx="6" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
  <rect x="185" y="10" width="165" height="58" rx="6" fill="var(--fig-warm)" stroke="var(--fig-line)" stroke-width="1.5"/>
  <g text-anchor="middle" fill="var(--fig-ink)">
    <text x="92.5" y="33" font-size="13">北大西洋公約組織</text><text x="92.5" y="55" font-size="12">美國領導・1949～</text>
    <text x="267.5" y="33" font-size="13">華沙公約組織</text><text x="267.5" y="55" font-size="12">蘇聯領導・1955～1991</text>
  </g>
  <rect x="10" y="82" width="340" height="51" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
  <text x="180" y="103" text-anchor="middle" font-size="13" fill="var(--fig-ink)">第三世界：</text>
  <text x="180" y="123" text-anchor="middle" font-size="12" fill="var(--fig-ink)">不加入兩大集團的亞非拉國家</text>
  <text x="180" y="155" text-anchor="middle" font-size="13" fill="var(--fig-ink)">冷戰衝突</text>
  <g fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5">
    <rect x="10" y="166" width="79" height="30" rx="5"/><rect x="97" y="166" width="79" height="30" rx="5"/>
    <rect x="184" y="166" width="79" height="30" rx="5"/><rect x="271" y="166" width="79" height="30" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="var(--fig-ink)">
    <text x="49.5" y="185">柏林危機</text><text x="136.5" y="185">古巴危機</text>
    <text x="223.5" y="185">韓戰・越戰</text><text x="310.5" y="185">以阿戰爭</text>
  </g>
  <g fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5">
    <rect x="10" y="220" width="108" height="48" rx="6"/><rect x="136" y="220" width="96" height="48" rx="6"/>
  </g>
  <rect x="250" y="220" width="100" height="48" rx="6" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="1.5"/>
  <path d="M120 244 H132" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" marker-end="url(#his-coldwar2-arr)"/>
  <path d="M234 244 H246" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" marker-end="url(#his-coldwar2-arr)"/>
  <g text-anchor="middle" font-size="12" fill="var(--fig-ink)">
    <text x="64" y="238">1985</text><text x="64" y="258">戈巴契夫改革</text>
    <text x="184" y="238">1989</text><text x="184" y="258">柏林圍牆倒</text>
    <text x="300" y="238">1991</text><text x="300" y="258">蘇聯解體</text>
  </g>
</svg>
