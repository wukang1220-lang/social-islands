<text x="112" y="20" font-size="11" text-anchor="middle" fill="var(--fig-ink)">哥倫布 1492：抵達美洲</text>
<path d="M164 78 C125 94 121 183 178 197" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#his-voyages-arr)"/>
