<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img"><title>中國農牧業以年降水量與秦嶺淮河為分界。</title><defs><marker id="geo-cnfarm-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="16" y="47" width="328" height="171" rx="3" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M174 49L174 216" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="174" y="25" font-size="12" text-anchor="middle" fill="var(--fig-ink)">年降水量 500 毫米</text><path d="M174 31L174 43" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="75" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">畜牧為主</text><text x="260" y="75" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">農業為主</text><text x="94" y="110" font-size="12" text-anchor="middle" fill="var(--fig-ink)">新疆：游牧</text><text x="94" y="133" font-size="12" text-anchor="middle" fill="var(--fig-ink)">青藏高原：山牧季移</text><rect x="27" y="166" width="135" height="30" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="94" y="186" font-size="12" text-anchor="middle" fill="var(--fig-ink)">綠洲、河谷可種植</text><text x="260" y="112" font-size="12" text-anchor="middle" fill="var(--fig-ink)">旱田：小麥、高粱</text><path d="M175 144L343 144" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><rect x="214" y="134" width="93" height="21" rx="2" fill="var(--fig-paper)" stroke="none" stroke-width="1.5"/><text x="260" y="149" font-size="12" text-anchor="middle" fill="var(--fig-ink)">秦嶺—淮河</text><text x="260" y="187" font-size="12" text-anchor="middle" fill="var(--fig-ink)">水田：水稻</text><text x="348" y="242" font-size="11" text-an