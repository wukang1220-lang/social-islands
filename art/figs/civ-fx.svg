<text x="180" y="62" font-size="14" text-anchor="middle" fill="var(--fig-ink)">1：30</text>
<path d="M139 56 H109 Q90 56 90 90" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-fx-arr)"/>
<path d="M221 56 H251 Q270 56 270 90" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-fx-arr)"/>
<rect x="8" y="94" width="164" height="136" rx="7" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<rect x="188" y="94" width="164" height="136" rx="7" fill="var(--fig-warm)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="90" y="116" font-size="14" text-anchor="middle" fill="var(--fig-ink)">1：28</text>
<text x="270" y="116" font-size="14" text-anchor="middle" fill="var(--fig-ink)">1：32</text>
<text x="90" y="140" font-size="13" text-anchor="middle" fill="var(--fig-ink)">新臺幣升值</text>
