<text x="21" y="28" font-size="13" text-anchor="start" fill="var(--fig-ink)" font-weight="600">原因</text>
<text x="21" y="49" font-size="11" text-anchor="start" fill="var(--fig-ink)">巴黎和會把山東權益交給日本</text>
<text x="21" y="98" font-size="13" text-anchor="start" fill="var(--fig-ink)" font-weight="600">事件</text>
<text x="21" y="115" font-size="11" text-anchor="start" fill="var(--fig-ink)">民國 8 年 5 月 4 日</text>
<text x="21" y="131" font-size="11" text-anchor="start" fill="var(--fig-ink)">學生遊行</text>
<text x="21" y="176" font-size="13" text-anchor="start" fill="var(--fig-ink)" font-weight="600">擴大</text>
<text x="21" y="195" font-size="11" text-anchor="start" fill="var(--fig-ink)">各地罷課、罷工、罷市</text>
<text x="21" y="241" font-size="13" text-anchor="start" fill="var(--fig-ink)" font-weight="600">結果</text>
<text x="21" y="261" font-size="11" text-anchor="start" fill="var(--fig-ink)">北京政府拒簽對德和約</text>
<rect x="257" y="80" width="95" height="97" rx="4" fill="var(--fig-warm)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="304.5" y="101" font-size="12" text-anchor="middle" fill="var(--fig-ink)">外爭主權，</text>
<text x="304.5" y="120" font-size="12" text-anchor="middle" fill="var(--fig-ink)">內除國賊</text>
<line x1="267" y1="133" x2="342" y2="133" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="304.5" y="155" font-size="12" text-anchor="middle" fill="var(--fig-ink)">還我青島</text>
<line x1="247" y1="109" x2="256" y2="109" stroke="var(--fig-soft)" stroke-width="1.5"/>
