<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img">
  <title>著作權法、專利法及商標法的保護對象與取得方式。</title>
  <rect x="12" y="12" width="336" height="156" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
  <path d="M48 13 H347 V46 H48 Z" fill="var(--fig-cool)"/>
  <path d="M48 12 V168 M148 12 V168 M248 12 V168 M12 46 H348 M12 120 H348" fill="none" stroke="var(--fig-line)" stroke-width="1.5"/>
  <g text-anchor="middle" fill="var(--fig-ink)">
    <g font-size="13"><text x="98" y="34">著作權法</text><text x="198" y="34">專利法</text><text x="298" y="34">商標法</text></g>
    <g font-size="12">
      <text x="30" y="86">保護</text><text x="98" y="74">語文・音樂・</text><text x="98" y="94">美術・攝影等</text>
      <text x="198" y="86">發明與創作</text><text x="298" y="86">品牌標誌</text>
      <text x="30" y="148">取得</text><text x="98" y="148">完成時就取得</text>
      <text x="198" y="148">申請審查通過</text><text x="298" y="148">申請審查通過</text>
    </g>
  </g>
  <rect x="12" y="188" width="336" height="58" rx="6" fill="var(--fig-sand)"/>
  <g text-anchor="middle" font-size="11.5" fill="var(--fig-ink)">
    <text x="180" y="210">著作財產權：保護到著作人死後 50 年</text>
    <text x="180" y="232">合理使用看：原創性・商業目的・使用比例・市場影響</text>
  </g>
</svg>
