<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" role="img"><title>戰後臺灣政治民主化的歷程：民國 38 年到 76 年戒嚴，之後解嚴、終止動員戡亂、總統直選與政黨輪替。</title><text x="180" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="var(--fig-ink)">政治民主化的歷程（民國紀年）</text><line x1="78" y1="32" x2="78" y2="238" stroke="var(--fig-line)" stroke-width="3"/><rect x="34" y="30" width="8" height="112" rx="3" fill="var(--fig-sand)"/><text x="38" y="26" font-size="11" text-anchor="middle" fill="var(--fig-soft)">38</text><text x="20" y="58" font-size="12" text-anchor="middle" fill="var(--fig-ink)">戒</text><text x="20" y="73" font-size="12" text-anchor="middle" fill="var(--fig-ink)">嚴</text><text x="20" y="88" font-size="12" text-anchor="middle" fill="var(--fig-ink)">時</text><text x="20" y="103" font-size="12" text-anchor="middle" fill="var(--fig-ink)">期</text><text x="66" y="50" font-size="12" text-anchor="end" fill="var(--fig-soft)">39</text><circle cx="78" cy="46" r="4" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="50" font-size="13" fill="var(--fig-ink)">開始實施地方自治</text><text x="66" y="73" font-size="12" text-anchor="end" fill="var(--fig-soft)">49</text><circle cx="78" cy="69" r="4" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="73" font-size="13" fill="var(--fig-ink)">雷震事件</text><text x="66" y="96" font-size="12" text-anchor="end" fill="var(--fig-soft)">68</text><circle cx="78" cy="92" r="4" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="96" font-size="13" fill="var(--fig-ink)">美麗島事件</text><text x="66" y="119" font-size="12" text-anchor="end" fill="var(--fig-soft)">75</text><circle cx="78" cy="115" r="4" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="119" font-size="13" fill="var(--fig-ink)">民主進步黨成立</text><text x="66" y="142" font-size="12" text-anchor="end" fill="var(--fig-soft)">76</text><circle cx="78" cy="138" r="5" fill="var(--ic)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="142" font-size="13" font-weight="700" fill="var(--fig-ink)">解除戒嚴，開放黨禁、報禁</text><text x="66" y="165" font-size="12" text-anchor="end" fill="var(--fig-soft)">79</text><circle cx="78" cy="161" r="4" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="165" font-size="13" fill="var(--fig-ink)">三月學運（野百合學運）</text><text x="66" y="188" font-size="12" text-anchor="end" fill="var(--fig-soft)">80</text><circle cx="78" cy="184" r="4" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="188" font-size="13" fill="var(--fig-ink)">終止動員戡亂、國會全面改選</text><text x="66" y="211" font-size="12" text-anchor="end" fill="var(--fig-soft)">85</text><circle cx="78" cy="207" r="5" fill="var(--ic)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="211" font-size="13" font-weight="700" fill="var(--fig-ink)">首次總統直選</text><text x="66" y="234" font-size="12" text-anchor="end" fill="var(--fig-soft)">89</text><circle cx="78" cy="230" r="5" fill="var(--ic)" stroke="var(--fig-ink)" stroke-width="1.5"/><text x="92" y="234" font-size="13" font-weight="700" fill="var(--fig-ink)">首次政黨輪替</text></svg>