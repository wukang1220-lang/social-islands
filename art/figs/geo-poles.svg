<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>北極與南極同有寒漠和永晝永夜，但主體、居民與環境重點不同。</title><rect x="12" y="7" width="336" height="43" rx="8" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5" /><text x="180" y="25" font-size="12" text-anchor="middle" fill="var(--fig-ink)">共同點：寒漠景觀・</text><text x="180" y="42" font-size="12" text-anchor="middle" fill="var(--fig-ink)">地軸傾斜造成永晝、永夜</text><rect x="12" y="59" width="336" height="216" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5" /><rect x="49" y="60" width="298" height="28" rx="0" fill="var(--fig-cool)" stroke="none" stroke-width="1.5" /><line x1="49" y1="59" x2="49" y2="275" stroke="var(--fig-line)" stroke-width="1.5" /><line x1="198" y1="59" x2="198" y2="275" stroke="var(--fig-line)" stroke-width="1.5" /><text x="123" y="79" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">北極地區</text><text x="273" y="79" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">南極地區</text><line x1="12" y1="89" x2="348" y2="89" stroke="var(--fig-line)" stroke-width="1.5" /><line x1="12" y1="130" x2="348" y2="130" stroke="var(--fig-line)" stroke-width="1.5" /><line x1="12" y1="174" x2="348" y2="174" stroke="var(--fig-line)" stroke-width="1.5" /><line x1="12" y1="214" x2="348" y2="214" stroke="var(--fig-line)" stroke-width="1.5" /><text x="30" y="113" font-size="12" text-anchor="middle" fill="var(--fig-ink)">範圍</text><text x="30" y="155" font-size="12" text-anchor="middle" fill="var(--fig-ink)">主體</text><text x="30" y="199" font-size="12" text-anchor="middle" fill="var(--fig-ink)">居民</text><text x="30" y="248" font-size="12" text-anchor="middle" fill="var(--fig-ink)">重點</text><text x="123" y="106" font-size="11" text-anchor="middle" fill="var(--fig-ink)">北極圈（66.5°N）</text><text x="123" y="122" font-size="11" text-anchor="middle" fill="var(--fig-ink)">以內</text><text x="273" y="106" font-size="11" text-anchor="middle" fill="var(--fig-ink)">南極圈（66.5°S）</text><text x="273" y="122" font-size="11" text-anchor="middle" fill="var(--fig-ink)">以內</text><text x="123" y="147" font-size="12" text-anchor="middle" fill="var(--fig-ink)">北極海</text><text x="123" y="164" font-size="11" text-anchor="middle" fill="var(--fig-ink)">（以海洋為主）</text><text x="273" y="147" font-size="12" text-anchor="middle" fill="var(--fig-ink)">南極洲</text><text x="273" y="164" font-size="11" text-anchor="middle" fill="var(--fig-ink)">（以陸地為主的高原）</text><text x="123" y="199" font-size="12" text-anchor="middle" fill="var(--fig-ink)">少數原住民族</text><text x="273" y="190" font-size="11" text-anchor="middle" fill="var(--fig-ink)">無人定居・</text><text x="273" y="207" font-size="11" text-anchor="middle" fill="var(--fig-ink)">以科學研究為主</text><text x="123" y="231" font-size="11" text-anchor="middle" fill="var(--fig-ink)">北極航道・</text><text x="123" y="248" font-size="11" text-anchor="middle" fill="var(--fig-ink)">飛越北極是</text><text x="123" y="265" font-size="11" text-anchor="middle" fill="var(--fig-ink)">最短航線</text><text x="273" y="231" font-size="11" text-anchor="middle" fill="var(--fig-ink)">地表最冷・</text><text x="273" y="248" font-size="11" text-anchor="middle" fill="var(--fig-ink)">主權不屬</text><text x="273" y="265" font-size="11" text-anchor="middle" fill="var(--fig-ink)">任何國家</text></svg>
