<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img">
<title>改革派與革命派的代表、主張和後來發展不同。</title>
<defs><marker id="his-revpaths-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<rect x="8" y="12" width="344" height="225" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<line x1="57" y1="12" x2="57" y2="237" stroke="var(--fig-line)" stroke-width="1.5"/>
<line x1="204.5" y1="12" x2="204.5" y2="237" stroke="var(--fig-line)" stroke-width="1.5"/>
<line x1="8" y1="49" x2="352" y2="49" stroke="var(--fig-line)" stroke-width="1.5"/>
<line x1="8" y1="99" x2="352" y2="99" stroke="var(--fig-line)" stroke-width="1.5"/>
<line x1="8" y1="160" x2="352" y2="160" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="131" y="36" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">改革派</text>
<text x="278" y="36" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">革命派</text>
<text x="32" y="79" font-size="12" text-anchor="middle" fill="var(--fig-ink)">代表</text>
<text x="131" y="79" font-size="12" text-anchor="middle" fill="var(--fig-ink)">康有為、梁啟超</text>
<text x="278" y="79" font-size="12" text-anchor="middle" fill="var(--fig-ink)">孫中山</text>
<text x="32" y="134" font-size="12" text-anchor="middle" fill="var(--fig-ink)">主張</text>
<text x="131" y="124" font-size="12" text-anchor="middle" fill="var(--fig-ink)">制度改革、</text>
<text x="131" y="144" font-size="12" text-anchor="middle" fill="var(--fig-ink)">君主立憲</text>
<text x="278" y="124" font-size="12" text-anchor="middle" fill="var(--fig-ink)">推翻帝制、</text>
<text x="278" y="144" font-size="12" text-anchor="middle" fill="var(--fig-ink)">建立民主共和</text>
<text x="32" y="204" font-size="12" text-anchor="middle" fill="var(--fig-ink)">後來</text>
<text x="131" y="186" font-size="12" text-anchor="middle" fill="var(--fig-ink)">預備立憲令人</text>
<text x="131" y="205" font-size="12" text-anchor="middle" fill="var(--fig-ink)">失望，轉而</text>
<text x="131" y="224" font-size="12" text-anchor="middle" fill="var(--fig-ink)">支持革命</text>
<text x="278" y="195" font-size="12" text-anchor="middle" fill="var(--fig-ink)">1911 年</text>
<text x="278" y="215" font-size="12" text-anchor="middle" fill="var(--fig-ink)">武昌起事成功</text>
</svg>
