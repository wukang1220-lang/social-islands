<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" role="img"><title>佛教、基督教與伊斯蘭教的創立、起源、主張和傳播範圍比較。</title><text x="180" y="21" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">三大普世宗教</text><rect x="12" y="34" width="336" height="230" rx="7" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5" /><rect x="48" y="35" width="299" height="27" rx="0" fill="var(--fig-cool)" stroke="none" stroke-width="1.5" /><line x1="48" y1="34" x2="48" y2="264" stroke="var(--fig-line)" stroke-width="1.5" /><line x1="148" y1="34" x2="148" y2="264" stroke="var(--fig-line)" stroke-width="1.5" /><line x1="248" y1="34" x2="248" y2="264" stroke="var(--fig-line)" stroke-width="1.5" /><text x="98" y="54" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">佛教</text><text x="198" y="54" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">基督教</text><text x="298" y="54" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">伊斯蘭教</text><line x1="12" y1="62" x2="348" y2="62" stroke="var(--fig-line)" stroke-width="1.5" /><text x="30" y="90.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">創立</text><text x="98" y="82.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">前 6 世紀・</text><text x="98" y="98.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">釋迦牟尼</text><text x="198" y="90.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">1 世紀・耶穌</text><text x="298" y="82.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">7 世紀・</text><text x="298" y="98.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">穆罕默德</text><line x1="12" y1="111" x2="348" y2="111" stroke="var(--fig-line)" stroke-width="1.5" /><text x="30" y="134.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">起源</text><text x="98" y="134.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">印度半島</text><text x="198" y="134.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">巴勒斯坦</text><text x="298" y="134.5" font-size="11" text-anchor="middle" fill="var(--fig-ink)">阿拉伯半島</text><line x1="12" y1="150" x2="348" y2="150" stroke="var(--fig-line)" stroke-width="1.5" /><text x="30" y="189.0" font-size="12" text-anchor="middle" fill="var(--fig-ink)">主張</text><text x="98" y="181.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">眾生平等・</text><text x="98" y="197.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">脫離輪迴</text><text x="198" y="181.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">平等博愛・</text><text x="198" y="197.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">《聖經》</text><text x="298" y="181.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">唯一真神阿拉・</text><text x="298" y="197.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">《古蘭經》</text><line x1="12" y1="220" x2="348" y2="220" stroke="var(--fig-line)" stroke-width="1.5" /><text x="30" y="246.0" font-size="12" text-anchor="middle" fill="var(--fig-ink)">傳播</text><text x="98" y="246.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">東亞、東南亞</text><text x="198" y="246.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">歐洲</text><text x="298" y="246.0" font-size="11" text-anchor="middle" fill="var(--fig-ink)">歐、亞、非各地</text></svg>
