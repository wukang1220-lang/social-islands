<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 265" role="img"><title>俄羅斯由歐俄平原經烏拉爾山向東接西伯利亞的平原、高原與山地。</title><defs><marker id="geo-russia-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--fig-ink)" /></marker></defs><text x="12" y="24" font-size="13" text-anchor="start" fill="var(--fig-ink)">西</text><text x="348" y="24" font-size="13" text-anchor="end" fill="var(--fig-ink)">東</text><text x="250" y="28" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">西伯利亞</text><text x="250" y="49" font-size="12" text-anchor="middle" fill="var(--fig-ink)">石油、天然氣</text><path d="M14 166H111L124 147L135 125L147 151L157 166H211V139H266L284 99L298 126L313 91L330 126L348 109V208H14Z" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M111 166L124 147L135 125L147 151L157 166Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M266 139L284 99L298 126L313 91L330 126L348 109V208H266Z" fill="var(--fig-sand)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="66" y="64" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">歐俄平原</text><text x="66" y="83" font-size="11" text-anchor="middle" fill="var(--fig-ink)">人口集中・</text><text x="66" y="99" font-size="11" text-anchor="middle" fill="var(--fig-ink)">可發展農業</text><text x="66" y="123" font-size="12" text-anchor="middle" fill="var(--fig-ink)">莫斯科・</text><text x="66" y="140" font-size="12" text-anchor="middle" fill="var(--fig-ink)">聖彼得堡</text><line x1="66" y1="147" x2="66" y2="161" stroke="var(--fig-soft)" stroke-width="1.5" /><text x="145" y="69" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">烏拉爾山</text><text x="145" y="87" font-size="11" text-anchor="middle" fill="var(--fig-ink)">煤、鐵</text><line x1="145" y1="95" x2="136" y2="119" stroke="var(--fig-soft)" stroke-width="1.5" /><text x="182" y="148" font-size="12" text-anchor="middle" fill="var(--fig-ink)">平原</text><text x="237" y="121" font-size="12" text-anchor="middle" fill="var(--fig-ink)">高原</text><text x="300" y="73" font-size="12" text-anchor="middle" fill="var(--fig-ink)">山地</text><text x="303" y="189" font-size="12" text-anchor="middle" fill="var(--fig-ink)">火山、地震</text><path d="M158 246V220" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-russia-arr)" /><text x="177" y="227" font-size="12" text-anchor="start" fill="var(--fig-ink)">地勢南高北低，</text><text x="177" y="245" font-size="12" text-anchor="start" fill="var(--fig-ink)">河川向北流</text><text x="348" y="260" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text></svg>
