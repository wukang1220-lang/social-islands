<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img">
<title>民國初年的政治事件由武昌起事延伸到南北分裂。</title>
<defs><marker id="his-earlyroc-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<line x1="17" y1="21" x2="17" y2="249" stroke="var(--fig-line)" stroke-width="1.5"/>
<circle cx="17" cy="24" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5"/>
<text x="31" y="28" font-size="12" text-anchor="start" fill="var(--fig-ink)">1911</text>
<text x="111" y="28" font-size="12" text-anchor="start" fill="var(--fig-ink)">保路運動，10 月 10 日</text>
<text x="111" y="45" font-size="12" text-anchor="start" fill="var(--fig-ink)">武昌起事</text>
