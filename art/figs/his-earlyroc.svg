<text x="31" y="100" font-size="12" text-anchor="start" fill="var(--fig-ink)">民國元年</text>
<text x="111" y="100" font-size="12" text-anchor="start" fill="var(--fig-ink)">清帝退位，袁世凱接任</text>
<text x="111" y="117" font-size="12" text-anchor="start" fill="var(--fig-ink)">臨時大總統</text>
<circle cx="17" cy="132" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5"/>
<text x="31" y="136" font-size="12" text-anchor="start" fill="var(--fig-ink)">民國 2 年</text>
<text x="111" y="136" font-size="12" text-anchor="start" fill="var(--fig-ink)">宋教仁遇刺，二次革命</text>
