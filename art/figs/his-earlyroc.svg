<circle cx="17" cy="240" r="3" fill="var(--ic)" stroke="none" stroke-width="1.5"/>
<text x="31" y="244" font-size="12" text-anchor="start" fill="var(--fig-ink)">民國 6 年</text>
<text x="111" y="244" font-size="12" text-anchor="start" fill="var(--fig-ink)">護法運動，南北分裂</text>
