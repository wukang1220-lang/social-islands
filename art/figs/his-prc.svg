<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
<title>中華人民共和國自成立至加入世界貿易組織的重要事件依序排列。</title>
<defs><marker id="his-prc-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<path d="M16 22V258" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="16" cy="22" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="26" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">1949</text>
<text x="111" y="26" font-size="12" text-anchor="start" fill="var(--fig-ink)">中華人民共和國成立</text>
<circle cx="16" cy="54" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="58" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">1958</text>
<text x="111" y="58" font-size="12" text-anchor="start" fill="var(--fig-ink)">大躍進・人民公社</text>
<circle cx="16" cy="86" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="90" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">1966</text>
<text x="111" y="90" font-size="12" text-anchor="start" fill="var(--fig-ink)">文化大革命</text>
<circle cx="16" cy="118" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="122" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">1976</text>
<text x="111" y="122" font-size="12" text-anchor="start" fill="var(--fig-ink)">毛澤東去世，文革落幕</text>
<circle cx="16" cy="150" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="154" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">文革後</text>
<text x="111" y="154" font-size="12" text-anchor="start" fill="var(--fig-ink)">鄧小平推動改革開放・</text>
<text x="111" y="171" font-size="12" text-anchor="start" fill="var(--fig-ink)">經濟特區</text>
<circle cx="16" cy="191" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="195" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">1989</text>
<text x="111" y="195" font-size="12" text-anchor="start" fill="var(--fig-ink)">六四天安門事件</text>
<circle cx="16" cy="223" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="227" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">1997・1999</text>
<text x="111" y="227" font-size="12" text-anchor="start" fill="var(--fig-ink)">香港、澳門主權移交</text>
<circle cx="16" cy="255" r="3" fill="var(--ic)" stroke="var(--ic)" stroke-width="1.5"/>
<text x="28" y="259" font-size="11.5" text-anchor="start" fill="var(--fig-soft)">2001</text>
<text x="111" y="259" font-size="12" text-anchor="start" fill="var(--fig-ink)">加入世界貿易組織</text>
</svg>
