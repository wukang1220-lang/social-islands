<text x="113" y="231" font-size="12" text-anchor="middle" fill="var(--fig-ink)">信風</text>
<path d="M73 216L73 249" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#geo-climbelt-arr)"/>
<rect x="168" y="14" width="184" height="42" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="260" y="31" font-size="11" text-anchor="middle" fill="var(--fig-ink)">寒帶</text>
