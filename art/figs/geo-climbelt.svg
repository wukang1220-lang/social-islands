<text x="260" y="196" font-size="11" text-anchor="middle" fill="var(--fig-ink)">（回歸線附近）</text>
<rect x="168" y="209" width="184" height="23" rx="4" fill="var(--fig-warm)" stroke="var(--fig-line)" stroke-width="1.5"/>
