<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img"><title>中國地勢由西向東分為三階梯，河川由西向東流。</title><defs><marker id="geo-cnsteps-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><text x="180" y="19" font-size="13" text-anchor="middle" fill="var(--fig-ink)">河川由西向東流</text><path d="M24 36Q49 24 74 36T124 36T174 36T224 36T274 36T335 36" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#geo-cnsteps-arr)"/><path d="M16 98H119V136H235V175H344V226H16Z" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 98H119V136H235V175H344" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="64" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">高階梯</text><text x="66" y="83" font-size="12" text-anchor="middle" fill="var(--fig-ink)">山地、高原</text><text x="66" y="113" font-size="11" text-anchor="middle" fill="var(--fig-ink)">4,000 公尺以上</text><text x="177" y="101" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">中階梯</text><text x="177" y="120" font-size="12" text-anchor="middle" fill="var(--fig-ink)">高原、盆地</text><text x="177" y="150" font-size="11" text-anchor="middle" fill="var(--fig-ink)">2,000 公尺以下</text><text x="291" y="140" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">低階梯</text><text x="291" y="159" font-size="12" text-anchor="middle" fill="var(--fig-ink)">平原、丘陵</text><text x="65" y="138" font-size="12" text-anchor="middle" fill="var(--fig-ink)">青藏高原</text><text x="177" y="177" font-size="11" text-anchor="middle" fill="var(--fig-ink)">內蒙古高原・</text><text x="177" y="193" font-size="11" text-anchor="middle" fill="var(--fig-ink)">黃土高原・</text><text x="177" y="209" font-size="11" text-anchor="middle" fill="var(--fig-ink)">四川盆地</text><text x="292" y="197" font-size="12" text-anchor="middle" fill="var(--fig-ink)">長江三角洲</text><text x="16" y="232" font-size="13" text-anchor="start" fill="var(--fig-ink)">西</text><text x="344" y="232" font-size="13" text-anchor="end" fill="var(--fig-ink)">東</text><text x="348" y="252" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text></svg>
