<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 254" role="img"><title>北韓與南韓在政治、產業及發展困境上有所不同。</title><defs><marker id="geo-koreas-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="10" y="12" width="340" height="195" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M55 12L55 207" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M202 12L202 207" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 46L350 46" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 83L350 83" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 131L350 131" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="35" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">北韓</text><text x="276" y="35" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">南韓</text><text x="32" y="70" font-size="12" text-anchor="middle" fill="var(--fig-ink)">政治</text><text x="32" y="112" font-size="12" text-anchor="middle" fill="var(--fig-ink)">產業</text><text x="32" y="174" font-size="12" text-anchor="middle" fill="var(--fig-ink)">困境</text><text x="128" y="70" font-size="12" text-anchor="middle" fill="var(--fig-ink)">獨裁</text><text x="276" y="70" font-size="12" text-anchor="middle" fill="var(--fig-ink)">民主</text><text x="128" y="112" font-size="12" text-anchor="middle" fill="var(--fig-ink)">重工業、國防工業</text><text x="276" y="112" font-size="12" text-anchor="middle" fill="var(--fig-ink)">高科技、娛樂影視</text><text x="128" y="159" font-size="12" text-anchor="middle" fill="var(--fig-ink)">經濟制裁、</text><text x="128" y="180" font-size="12" text-anchor="middle" fill="var(--fig-ink)">民生物資缺乏</text><text x="276" y="159" font-size="12" text-anchor="middle" fill="var(--fig-ink)">依賴大型財閥，</text><text x="276" y="180" font-size="12" text-anchor="middle" fill="var(--fig-ink)">風險集中</text><rect x="10" y="218" width="340" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="237" font-size="12" text-anchor="middle" fill="var(--fig-ink)">長期對峙是半島發展的威脅</text></svg>
