<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 225" role="img"><title>社會安全從宗教慈善走向國家制度以提升全民福祉。</title><defs><marker id="civ-security-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="8" y="22" width="77" height="180" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="46.5" y="48" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">早期：</text><text x="46.5" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">宗教慈善</text><text x="46.5" y="122" font-size="11" text-anchor="middle" fill="var(--fig-ink)">力量有限、</text><text x="46.5" y="141" font-size="11" text-anchor="middle" fill="var(--fig-ink)">難以持續</text><path d="M87 104L95 104" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-security-arr)"/><rect x="97" y="22" width="77" height="180" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="135.5" y="48" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">18 世紀</text><text x="135.5" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">工業革命</text><text x="135.5" y="122" font-size="11" text-anchor="middle" fill="var(--fig-ink)">職災、</text><text x="135.5" y="141" font-size="11" text-anchor="middle" fill="var(--fig-ink)">勞資對立、</text><text x="135.5" y="160" font-size="11" text-anchor="middle" fill="var(--fig-ink)">貧富差距</text><path d="M176 104L184 104" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-security-arr)"/><rect x="186" y="22" width="77" height="180" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="224.5" y="48" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">現代：</text><text x="224.5" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">國家建立</text><text x="224.5" y="86" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">制度</text><text x="224.5" y="122" font-size="11" text-anchor="middle" fill="var(--fig-ink)">公權力</text><text x="224.5" y="141" font-size="11" text-anchor="middle" fill="var(--fig-ink)">分配資源</text><path d="M265 104L273 104" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-security-arr)"/><rect x="275" y="22" width="77" height="180" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="313.5" y="48" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">目標：</text><text x="313.5" y="67" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">提升全民</text><text x="313.5" y="86" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">福祉</text></svg>
