<text x="264" y="186" font-size="14" text-anchor="middle" fill="var(--fig-ink)">進口</text>
<text x="96" y="209" font-size="11" text-anchor="middle" fill="var(--fig-ink)">外國資金 → 本國</text>
<text x="264" y="209" font-size="11" text-anchor="middle" fill="var(--fig-ink)">本國資金 → 外國</text>
<path d="M169 181 L190 181" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-intltrade-arr)"/>
<path d="M191 205 L170 205" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-intltrade-arr)"/>
<text x="180" y="249" font-size="12" text-anchor="middle" fill="var(--fig-soft)">出口成本：生產・運輸・關稅</text>
