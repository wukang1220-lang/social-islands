<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 245" role="img"><title>黑河騰衝線兩側的人口與自然環境不同。</title><defs><marker id="geo-huline-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="25" y="37" width="310" height="170" rx="2" fill="var(--fig-sand)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M282 37H335V207H77Z" fill="var(--ic)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.12"/><path d="M282 37L77 207" fill="none" stroke="var(--ic)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="286" y="24" font-size="13" text-anchor="middle" fill="var(--fig-ink)">黑河</text><path d="M283 27L282 34" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="228" font-size="13" text-anchor="middle" fill="var(--fig-ink)">騰衝</text><path d="M73 215L77 208" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="86" font-size="12" text-anchor="middle" fill="var(--fig-ink)">人口稀少</text><text x="112" y="109" font-size="12" text-anchor="middle" fill="var(--fig-ink)">高山、乾燥少雨</text><rect x="175" y="139" width="150" height="53" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="250" y="159" font-size="12" text-anchor="middle" fill="var(--fig-ink)">約 94% 人口</text><text x="250" y="181" font-size="12" text-anchor="middle" fill="var(--fig-ink)">地形平坦、雨量較多</text><text x="348" y="237" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text></svg>
