<text x="299" y="174" font-size="12" text-anchor="middle" fill="var(--fig-ink)">褫奪公權</text>
<rect x="12" y="246" width="336" height="28" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="180" y="265" font-size="13" text-anchor="middle" fill="var(--fig-ink)">沒收：不法所得可單獨宣告</text>
