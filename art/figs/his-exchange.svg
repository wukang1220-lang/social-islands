<defs><marker id="his-exchange-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="var(--fig-ink)" stroke-width="1.5"/></marker></defs>
<text x="180" y="22" font-size="14" text-anchor="middle" fill="var(--fig-ink)">大航海後的交流</text>
<rect x="10" y="112" width="66" height="48" rx="7" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/>
<rect x="242" y="39" width="108" height="44" rx="7" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<rect x="260" y="210" width="80" height="40" rx="7" fill="var(--fig-sand)" stroke="var(--fig-line)" stroke-width="1.5"/>
