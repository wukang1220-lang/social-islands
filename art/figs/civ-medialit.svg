<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 202" role="img"><title>媒體識讀由懷疑、查證到謹慎轉發的步驟。</title><defs><marker id="civ-medialit-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><rect x="8" y="21" width="104" height="113" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="60" y="51" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">1 懷疑</text><text x="60" y="83" font-size="12" text-anchor="middle" fill="var(--fig-ink)">這是真的嗎？</text><path d="M115 74L126 74" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-medialit-arr)"/><rect x="128" y="21" width="104" height="113" rx="6" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="51" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">2 查證</text><text x="180" y="83" font-size="12" text-anchor="middle" fill="var(--fig-ink)">事實查核平臺・</text><text x="180" y="102" font-size="12" text-anchor="middle" fill="var(--fig-ink)">官方澄清</text><path d="M235 74L246 74" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-medialit-arr)"/><rect x="248" y="21" width="104" height="113" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="300" y="51" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">3 謹慎轉發</text><text x="300" y="83" font-size="12" text-anchor="middle" fill="var(--fig-ink)">確認後再分享</text><rect x="10" y="154" width="340" height="35" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="176" font-size="12" text-anchor="middle" fill="var(--fig-soft)">多看不同立場的媒體，避免同溫層</text></svg>
