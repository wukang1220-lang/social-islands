<text x="145" y="42" font-size="11" text-anchor="middle" fill="var(--fig-soft)">傳入</text>
<text x="187" y="42" font-size="11" text-anchor="middle" fill="var(--fig-soft)">→</text>
<text x="275" y="42" font-size="11" text-anchor="middle" fill="var(--fig-soft)">地區</text>
