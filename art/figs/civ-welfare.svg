<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 251" role="img"><title>依社會福利基本法比較社會保險、津貼與救助。</title><defs><marker id="civ-welfare-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><text x="180" y="25" font-size="13" text-anchor="middle" fill="var(--fig-soft)">依《社會福利基本法》</text><rect x="8" y="46" width="112" height="193" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><rect x="8" y="46" width="112" height="38" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="64" y="71" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">社會保險</text><text x="64" y="110" font-size="12" text-anchor="middle" fill="var(--fig-ink)">先繳保費</text><text x="64" y="129" font-size="12" text-anchor="middle" fill="var(--fig-ink)">再給付</text><path d="M17 147L111 147" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="177" font-size="11" text-anchor="middle" fill="var(--fig-ink)">例：全民健保、</text><text x="64" y="197" font-size="11" text-anchor="middle" fill="var(--fig-ink)">國民年金、勞保</text><rect x="124" y="46" width="112" height="193" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><rect x="124" y="46" width="112" height="38" rx="6" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="180" y="71" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">社會津貼</text><text x="180" y="110" font-size="12" text-anchor="middle" fill="var(--fig-ink)">特殊需求的</text><text x="180" y="129" font-size="12" text-anchor="middle" fill="var(--fig-ink)">現金給付</text><path d="M133 147L227 147" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="177" font-size="11" text-anchor="middle" fill="var(--fig-ink)">例：生育、育兒、</text><text x="180" y="197" font-size="11" text-anchor="middle" fill="var(--fig-ink)">老年津貼</text><rect x="240" y="46" width="112" height="193" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><rect x="240" y="46" width="112" height="38" rx="6" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="296" y="71" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">社會救助</text><text x="296" y="110" font-size="12" text-anchor="middle" fill="var(--fig-ink)">協助經濟弱勢</text><text x="296" y="129" font-size="12" text-anchor="middle" fill="var(--fig-ink)">與急難</text><path d="M249 147L343 147" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="296" y="177" font-size="11" text-anchor="middle" fill="var(--fig-ink)">例：低收入戶</text><text x="296" y="197" font-size="11" text-anchor="middle" fill="var(--fig-ink)">補助、災害救助</text></svg>
