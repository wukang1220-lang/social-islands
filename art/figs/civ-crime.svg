<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img">
<title>犯罪行為包含在違法行為之內且刑罰必須事先由法律明定。</title>
<defs><marker id="civ-crime-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
<circle cx="108" cy="142" r="99" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/>
<text x="108" y="74" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">違法行為</text>
<text x="108" y="95" font-size="12" text-anchor="middle" fill="var(--fig-ink)">違反任何法律</text>
<text x="108" y="116" font-size="12" text-anchor="middle" fill="var(--fig-soft)">超速被罰款</text>
<circle cx="108" cy="182" r="53" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.5"/>
<text x="108" y="162" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">犯罪行為</text>
<text x="108" y="184" font-size="12" text-anchor="middle" fill="var(--fig-ink)">觸犯刑法</text>
<text x="108" y="206" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">超速撞死人</text>
<rect x="217" y="43" width="134" height="215" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="284" y="67" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">罪刑法定</text>
<rect x="225" y="88" width="118" height="57" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="284" y="110" font-size="12" text-anchor="middle" fill="var(--fig-ink)">1999 年以前：</text>
<text x="284" y="131" font-size="12" text-anchor="middle" fill="var(--fig-ink)">酒駕只罰款</text>
<path d="M284 150V171" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#civ-crime-arr)"/>
<rect x="225" y="179" width="118" height="68" rx="5" fill="var(--fig-sand)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text x="284" y="198" font-size="12" text-anchor="middle" fill="var(--fig-ink)">1999 年起：</text>
<text x="284" y="217" font-size="12" text-anchor="middle" fill="var(--fig-ink)">列入公共</text>
<text x="284" y="236" font-size="12" text-anchor="middle" fill="var(--fig-ink)">危險罪</text>
</svg>
