<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 255" role="img"><title>中國四大經濟區具有不同的發展特色。</title><defs><marker id="geo-cnregions-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs><text x="180" y="22" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">中國四大經濟區</text><rect x="10" y="38" width="164" height="96" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M22 69L162 69" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="60" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">東部率先發展</text><text x="92" y="91" font-size="12" text-anchor="middle" fill="var(--fig-ink)">最早開放、交通便利、</text><text x="92" y="111" font-size="12" text-anchor="middle" fill="var(--fig-ink)">工商業最發達</text><rect x="186" y="38" width="164" height="96" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M198 69L338 69" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="268" y="60" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">中部崛起</text><text x="268" y="91" font-size="12" text-anchor="middle" fill="var(--fig-ink)">煤、糧食與低廉工資，</text><text x="268" y="111" font-size="12" text-anchor="middle" fill="var(--fig-ink)">連結東西的樞紐</text><rect x="10" y="145" width="164" height="96" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M22 176L162 176" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="167" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">東北振興</text><text x="92" y="198" font-size="12" text-anchor="middle" fill="var(--fig-ink)">傳統重工業區，</text><text x="92" y="218" font-size="12" text-anchor="middle" fill="var(--fig-ink)">礦產枯竭、設備老舊</text><rect x="186" y="145" width="164" height="96" rx="6" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.5"/><path d="M198 176L338 176" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="268" y="167" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">西部開發</text><text x="268" y="198" font-size="12" text-anchor="middle" fill="var(--fig-ink)">資源豐富但交通不便，</text><text x="268" y="218" font-size="12" text-anchor="middle" fill="var(--fig-ink)">能源輸往東部</text></svg>
